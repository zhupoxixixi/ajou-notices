name: Update notices and deploy
on:
  schedule:
    - cron: '17 23,3,9 * * *' # KST 08:17, 12:17, 18:17; execution can be delayed
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: notices-update-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'gpt-6-luna' }}
      TRANSLATE_API_ENDPOINT: ${{ vars.TRANSLATE_API_ENDPOINT || 'https://factchat-cloud.mindlogic.ai/v1/gateway' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Test date boundaries and failure preservation
        run: |
          node tests.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh and translate changed notices
        id: refresh
        continue-on-error: true
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
        run: python -X utf8 update.py
      - name: Build current archive
        run: python -X utf8 build.py
      - name: Commit published summaries and incremental state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ dist/
          if ! git diff --cached --quiet; then
            git commit -m "Update notices $(TZ=Asia/Seoul date +%F-%H%M)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Report a failed refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::error::Refresh failed; previous archive was preserved. See the refresh step.'
          exit 1
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
