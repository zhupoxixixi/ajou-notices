name: Update notices and deploy
on:
  schedule:
    - cron: '17 23,3,9 * * *' # KST 08:17, 12:17, 18:17; execution can be delayed
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: notices-update-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish_ref: ${{ steps.commit.outputs.publish_ref }}
      artifact_ready: ${{ steps.artifact.outcome }}
    env:
      PYTHONUNBUFFERED: '1'
      TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'gpt-6-luna' }}
      TRANSLATE_API_ENDPOINT: ${{ vars.TRANSLATE_API_ENDPOINT || 'https://factchat-cloud.mindlogic.ai/v1/gateway' }}
      SOURCE_CACHE_MINUTES: ${{ github.event_name == 'schedule' && '0' || '60' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Test date boundaries and failure preservation
        run: |
          node tests.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Decide whether sources need refreshing
        id: scope
        run: |
          python - <<'PY'
          import os, subprocess
          refresh = os.environ['GITHUB_EVENT_NAME'] != 'push'
          if not refresh:
              result = subprocess.run(['git','diff','--name-only','HEAD^','HEAD'],capture_output=True,text=True)
              source_files = {'update.py','ai_translate.py','crawl.py','public_sources.py','source_gateway.py','reader_gateway.py','requirements.txt'}
              refresh = result.returncode != 0 or bool(source_files.intersection(result.stdout.splitlines()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('refresh='+str(refresh).lower()+'\n')
          print('Refresh sources' if refresh else 'Publish UI using the retained archive; scheduled refreshes remain enabled')
          PY
      - name: Refresh and translate changed notices
        id: refresh
        if: steps.scope.outputs.refresh == 'true'
        continue-on-error: true
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          SOURCE_TRANSPORT: api
        run: python -X utf8 update.py
      - name: Build current archive
        run: python -X utf8 build.py
      - name: Commit published summaries and incremental state
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ dist/
          if ! git diff --cached --quiet; then
            git commit -m "Update notices $(TZ=Asia/Seoul date +%F-%H%M)"
            git push
          fi
          echo "publish_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: dist
      - name: Report a failed refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::error::Refresh failed; previous archive was preserved. See the refresh step.'
          exit 1
  deploy:
    needs: update
    if: always() && !cancelled() && needs.update.outputs.artifact_ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.publish_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published data, notify changes and report health
        env:
          ENABLE_NOTIFICATIONS: ${{ vars.ENABLE_NOTIFICATIONS || 'false' }}
          ENABLE_HEALTHCHECKS: ${{ vars.ENABLE_HEALTHCHECKS || 'false' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: python -X utf8 delivery.py publish
      - name: Save notification receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/delivery.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record delivered notice changes"
            git push origin HEAD:main
          fi
  report-failure:
    if: always() && (needs.update.result == 'failure' || needs.deploy.result == 'failure')
    needs: [update, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Report failure to external monitor when configured
        env:
          ENABLE_HEALTHCHECKS: ${{ vars.ENABLE_HEALTHCHECKS || 'false' }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: python -X utf8 delivery.py failure
