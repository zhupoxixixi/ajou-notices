name: Diagnose official source connectivity
on:
  push:
    branches: [diagnose-notice-sources-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Read public sources without credentials
        run: |
          python - <<'PY'
          import requests, time, os, json, concurrent.futures
          urls = {
              'graduate':'https://grad.ajou.ac.kr/gs/community/notice.do?mode=list&articleLimit=10',
              'university':'https://www.ajou.ac.kr/kr/ajou/notice.do?mode=list&articleLimit=10',
              'library':'https://library.ajou.ac.kr/pyxis-api/1/bulletin-boards/1/bulletins?offset=0&max=1&includeContent=true'
          }
          def probe(pair):
              name,url=pair; start=time.monotonic()
              try:
                  r=requests.get(url,timeout=(6,12),headers={'User-Agent':'AjouNoticeArchive/1.0 (public academic notice reader)'})
                  r.raise_for_status()
                  valid=r.json().get('success') is True if name=='library' else 'articleNo=' in r.text
                  return {'source':name,'valid':valid,'seconds':round(time.monotonic()-start,2),'status':r.status_code}
              except Exception as e:
                  return {'source':name,'valid':False,'seconds':round(time.monotonic()-start,2),'error':type(e).__name__}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              result={'runner':os.environ['RUNNER_OS'],'results':list(pool.map(probe,urls.items()))}
          print('::notice title=Official source probe::'+json.dumps(result))
          PY
